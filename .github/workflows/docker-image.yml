# Сборка и публикация образа линтера в GHCR.
#
# Образ собирается здесь, а не в каждом установленном проекте: Dockerfile один и тот же,
# а локальная сборка давала бы у каждого свой неподтверждённый результат. Потребитель
# получает готовый проверенный образ: docker pull ghcr.io/<owner>/<repo>.
#
# На push в main публикуется тег latest и текущая версия из VERSION. На pull_request образ
# собирается, но не публикуется — это проверка сборки без побочных эффектов. Версионированный
# образ релиза (vX.Y.Z) публикует сценарий release.yml. Схемы и эталоны вкомпилированы в бинарь,
# поэтому образ самодостаточен.
name: docker-image

on:
  push:
    branches:
      - main
    paths:
      - docker/struct-linter/Dockerfile
      - VERSION
      - go.mod
      - go.sum
      - assets.go
      - cmd/**
      - internal/**
      - schemas/**
      - templates/**
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - docker/struct-linter/Dockerfile
      - go.mod
      - go.sum
      - assets.go
      - cmd/**
      - internal/**
      - schemas/**
      - templates/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:

# Публикация образа требует записи в пакеты; чтение содержимого — для сборки.
permissions:
  contents: read
  packages: write

# Держать в очереди устаревший прогон той же ссылки незачем: arm64 идёт через эмуляцию.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Сборка и публикация образа
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4

      # Имя образа — координаты репозитория в нижнем регистре: путь GHCR заглавных не допускает.
      - name: Расчёт имени образа и версии
        id: params
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image=$(printf '%s\n' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          version=$(head -n 1 VERSION | tr -d ' \011\015\012')
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "VERSION не разбирается как МАЖОР.МИНОР.ПАТЧ: прочитано «$version»" >&2; exit 1; }
          echo "image=ghcr.io/$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Настройка QEMU
        uses: docker/setup-qemu-action@v3

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v3

      # На pull_request логина и публикации нет — только проверка сборки.
      - name: Логин в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/struct-linter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=v${{ steps.params.outputs.version }}
          tags: |
            ${{ steps.params.outputs.image }}:latest
            ${{ steps.params.outputs.image }}:v${{ steps.params.outputs.version }}
